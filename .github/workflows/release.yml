name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-binaries:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build package
        run: npm run build:package

      - name: Build native binaries
        run: npm run build:native

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-native/envoq-linux-x64
            dist-native/envoq-linux-arm64
            dist-native/envoq-macos-x64
            dist-native/envoq-macos-arm64
            dist-native/envoq-windows-x64.exe
            dist-native/checksums.txt
